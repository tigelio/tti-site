<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NEXUS STORE</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a12;color:#fff;padding:15px}header{text-align:center}header h1{font-size:32px;letter-spacing:3px}header h1 span{color:#a855f7}header p{color:#888;font-size:13px}input{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#1a1a28;color:#fff;margin:12px 0}.card{background:#1a1a28;padding:12px;border-radius:15px;margin:10px 0;display:flex;gap:12px;align-items:center}.card img{width:60px;height:60px;border-radius:12px}.card a{background:#a855f7;color:#fff;text-decoration:none;padding:10px 14px;border-radius:20px;font-weight:bold;font-size:13px}</style>
</head><body>
<header><h1>NEXUS <span>STORE</span></h1><p>Onde tudo se conecta</p></header>
<input id="pesquisa" placeholder="🔍 Pesquisar na NEXUS..." oninput="mostrar()">
<div id="lista">A carregar...</div>
<script>
let apps=[];
fetch('apps.json').then(r=>r.json()).then(d=>{apps=d;mostrar()});
function mostrar(){
let t=document.getElementById('pesquisa').value.toLowerCase();
let h="";
apps.forEach(a=>{
if(!a.nome.toLowerCase().includes(t)) return;
h+=`<div class="card"><img src="${a.icon}"><div style="flex:1"><b>${a.nome}</b><p style="font-size:12px;color:#aaa">${a.desc}</p><p style="font-size:12px;color:#888">${a.info}</p></div><a href="${a.apk}" download>Baixar</a></div>`;
});
document.getElementById('lista').innerHTML=h;
}
</script></body></html>
